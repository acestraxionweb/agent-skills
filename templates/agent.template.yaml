# Agent Configuration Template
# Copy this file to agents/<agent-name>.yaml

agent:
  name: "<agent-name>"
  description: "What this agent does"
  version: "1.0.0"
  author: "<your-name>"

  system_prompt: |
    You are a <role> that <purpose>.
    You have access to these skills: <list skills>.

  skills:
    - domain: <domain>
      name: <skill-name>
      version: "1.0.0"

  constraints:
    - "Do not "
    - "Always "

  memory:
    enabled: true
    type: semantic

  platforms: [openwebui, mcp, openai, claude]
